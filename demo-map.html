<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bản thử bản đồ giấy — Legend of Capsules</title>
    <link rel="icon" href="data:,">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #9c8f5e; font-family: system-ui, "Segoe UI", sans-serif; }
        #paper-canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; }
        .tag { position: fixed; left: 16px; padding: 9px 14px; border-radius: 12px; background: rgba(246, 233, 205, .92); color: #4a2f1c;
               box-shadow: 0 3px 0 rgba(90, 50, 20, .35); font-size: 14px; line-height: 1.45; max-width: min(420px, calc(100vw - 32px)); }
        #title { top: 16px; font-weight: 700; }
        #hint { bottom: 16px; }
        #btn-blur { position: fixed; top: 16px; right: 16px; padding: 9px 14px; border: 0; border-radius: 12px; background: #d2532c; color: #fff6dc;
                    font: 600 14px system-ui, "Segoe UI", sans-serif; box-shadow: 0 3px 0 #8e2d1c; cursor: pointer; }
        #btn-blur:active { transform: translateY(2px); box-shadow: 0 1px 0 #8e2d1c; }
        #btn-blur:focus-visible { outline: 3px solid #fff6dc; outline-offset: 2px; }
        @media (max-width: 560px) { #title { display: none; } #btn-blur { left: 16px; right: auto; } }
    </style>
</head>
<body>
    <canvas id="paper-canvas"></canvas>
    <div id="title" class="tag">Bản thử: bản đồ giấy cắt dán</div>
    <button id="btn-blur" type="button" aria-pressed="true">Làm mờ xa–gần: Bật</button>
    <div id="hint" class="tag">Bấm vào bản đồ để nhân vật đi tới đó, hoặc dùng phím W A S D / mũi tên. Lăn chuột để phóng to, thu nhỏ.</div>
    <script type="module" src="/src/demo/papermap.js"></script>
</body>
</html>
