<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#2f4a5a;overflow:hidden}
#lbl{position:fixed;left:10px;top:8px;font:bold 18px sans-serif;color:#ffe680;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:4px}#lbl:empty{display:none}</style></head><body><div id="lbl"></div>
<!-- Xem thử MỌI kỹ năng + hiệu ứng của Ignar (gọi đúng hàm xử lý sự kiện của game với dữ liệu giả, mốc thời gian như server).
     PHẢI chạy `npm run dev` rồi mở http://localhost:5173/tools/fx-ignar.html?s=all&auto=1
     s = all (lần lượt tất cả) | attack | meteor | pillar | god | ward
     &w=1280&h=720 cỡ khung · &auto=1 tự chạy lặp · console: stepTo(giây) -->
<script>
  window.__vt = 0; const __timers = []; let __tid = 1;
  window.setTimeout = (fn, ms = 0) => { const id = __tid++; __timers.push({ id, at: window.__vt + (ms || 0) / 1000, fn }); return id; };
  window.clearTimeout = (id) => { const i = __timers.findIndex(t => t.id === id); if (i >= 0) __timers.splice(i, 1); };
  window.__runTimers = () => { for (;;) { __timers.sort((a, b) => a.at - b.at); if (!__timers.length || __timers[0].at > window.__vt) break; __timers.shift().fn(); } };
  performance.now = () => 1 + window.__vt * 1000;
</script>
<script type="module">
import * as THREE from 'three';
import { scene, camera, renderer } from '../src/core/scene.js';
import { updateVfx } from '../src/vfx/vfx.js';
import { timeState } from '../src/config.js';
import { game } from '../src/state.js';
import { createCharacterView } from '../src/characters/registry.js';
import { __fxTest as T } from '../src/combat/events.js';
timeState.clock = 0; timeState.recvAt = 1; timeState.scale = 1;
const q = new URLSearchParams(location.search);
const S = q.get('s') || 'all';
const W = +(q.get('w') || 1280), H = +(q.get('h') || 720);
document.body.appendChild(renderer.domElement);
renderer.setSize(W, H); camera.aspect = W / H; camera.fov = 34; camera.updateProjectionMatrix();
const CX = +(q.get('cx') ?? 1.2), CY = +(q.get('cy') ?? 1.9), CZ = +(q.get('cz') ?? 16.5);   // &cx=-3&cy=1.4&cz=8: soi cận
camera.position.set(CX, CY + 2.7, CZ); camera.lookAt(CX, CY, 0);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshLambertMaterial({ color: 0x6d8f55 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.5; scene.add(ground);
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const mk = (classId, x, side, z = 0) => ({ classId, alive: true, statusEffects: [], x, z, hp: 100, maxHp: 100, mp: 3000, maxMp: 5000, state: 'idle', side,
  skillCooldowns: [0, 0, 0], queuedSkills: [], targetIndex: 0 });
const ig = mk('mage', -4, 'left');
const allies = [ig];
const foes = [mk('monster_tank', 4.5, 'right'), mk('monster_archer', 6.8, 'right', -1), mk('monster_supporter', 6, 'right', 1.2)];
game.roomData = { players: { me: { squad: allies }, op: { squad: foes } } };
game.classDefs = { mage: { skills: [{ type: 'sky_fireball' }, { type: 'fire_pillar' }, { type: 'fire_god' }] },
  monster_tank: { skills: [] }, monster_archer: { skills: [] }, monster_supporter: { skills: [] } };
const vA = allies.map(m => createCharacterView(m, game.classDefs[m.classId], true));
const vF = foes.map(f => createCharacterView(f, { skills: [] }, false));
vF.forEach(v => { v.facingLeft = true; });
game.views = { me: vA, op: vF };
[...vA, ...vF].forEach(v => scene.add(v.root));
window.view = vA[0];

const lbl = document.getElementById('lbl');
const ev = [];
const at = (t, fn) => ev.push([t, fn]);
const say = (t, s) => at(t, () => { lbl.textContent = s; });
const BIG = 1e12;
const hits = (idx, dmg = 300, extra = {}) => idx.map(i => ({ targetIndex: i, damage: dmg, isCrit: false, isBlock: false, isMiss: false, ...extra }));
const exec = (skillIdx, type, payload = {}) => T.onSkillExecuted({ casterId: 'me', casterIdx: 0, skillIdx, type, effects: [], ...payload });
const cast = (skillIdx, castTime) => T.onCastStart({ casterId: 'me', casterIdx: 0, skillIdx, castTime });
const fireHits = (kind, x, z, radius, effects) => T.onFireHits({ casterId: 'me', casterIdx: 0, kind, x, z, radius, effects });
const god = (kind, extra = {}) => T.onFireGod({ casterId: 'me', casterIdx: 0, ...extra, kind });
const attack = (ti = 0) => T.onAutoAttack({ attackerId: 'me', attackerIndex: 0, targetId: 'op', targetIndex: ti, damage: 212, isCrit: false });

// mốc như server (server.js: Thiên Hỏa Cầu impact 950 · biển lửa 3 lần mỗi 600 · Cột Lửa circle 1000, impact 1250, 7 lần mỗi 400)
function seqAttack(t0) { say(t0, 'Đánh thường: ném cầu lửa'); at(t0, () => attack(0)); at(t0 + 1.1, () => attack(1)); return t0 + 2.2; }
function seqMeteor(t0) {
  say(t0, 'Thiên Hỏa Cầu: niệm 1s'); at(t0, () => cast(0, 1000));
  const t1 = t0 + 1.0, burn = { ticks: 3, gap: 600 };
  at(t1, () => { lbl.textContent = 'Thiên Hỏa Cầu: thiên thạch rơi → nổ → biển lửa'; exec(0, 'sky_fireball', { balls: [
    { x: 5.4, z: 0, at: 950, radius: 5.5, burn }, { x: 6.6, z: 0.7, at: 1270, second: true, radius: 4.1, burn }] }); });
  at(t1 + 0.95, () => fireHits('meteor', 5.4, 0, 5.5, hits([0, 1, 2], 640)));
  at(t1 + 1.27, () => fireHits('meteor2', 6.6, 0.7, 4.1, hits([1, 2], 420)));
  for (let k = 1; k <= 3; k++) at(t1 + 0.95 + k * 0.6, () => fireHits('burn', 5.4, 0, 5.5, hits([0, 1, 2], 90)));
  return t1 + 3.4;
}
function seqPillar(t0) {
  say(t0, 'Cột Lửa Phá Ma: niệm 1s'); at(t0, () => cast(1, 1000));
  const t1 = t0 + 1.0;
  at(t1, () => { lbl.textContent = 'Cột Lửa Phá Ma: chưởng đất → vòng phép → cột lửa ×7'; exec(1, 'fire_pillar', { pillar: { x: 5.6, z: 0, at: 1250, hits: 7, gap: 400, radius: 5, circleTime: 1000 } }); });
  for (let k = 0; k < 7; k++) at(t1 + 1.25 + k * 0.4, () => fireHits('pillar', 5.6, 0, 5, hits([0, 1, 2], 140)));
  return t1 + 4.6;
}
function seqGod(t0) {
  say(t0, 'Hỏa Thần Giáng Lâm: gồng 1,5s'); at(t0, () => cast(2, 1500));
  const t1 = t0 + 1.5;
  at(t1, () => { lbl.textContent = 'Hỏa Thần Giáng Lâm: cánh lửa + Hộ Vệ + Khiên Lửa'; exec(2, 'fire_god', {}); ig.statusEffects = [{ type: 'fire_god', endTime: BIG }]; });
  say(t1 + 1.2, 'Hỏa Chưởng'); at(t1 + 1.2, () => god('palm', { targetIndex: 0, effects: hits([0, 1], 380) }));
  say(t1 + 2.3, 'Hộ Vệ Thần Lửa ném cầu lửa'); at(t1 + 2.3, () => god('guardian', { targetIndex: 1, effects: hits([1], 220) }));
  say(t1 + 3.2, 'Chưởng toàn thể (nhảy)'); at(t1 + 3.2, () => god('volley', { effects: hits([0, 1, 2], 420) }));
  say(t1 + 4.4, 'Hỏa Chưởng'); at(t1 + 4.4, () => god('palm', { targetIndex: 0, effects: hits([0, 2], 380) }));
  at(t1 + 5.6, () => { ig.statusEffects = []; });
  return t1 + 6.0;
}
function seqWard(t0) {
  say(t0, 'Giáp Lửa (thiên phú 2): bật khiên'); at(t0, () => { T.onFireWard({ kind: 'on', casterId: 'me', casterIdx: 0, shield: 1500, targetId: 'op', pushed: [], knockTime: 350 }); ig.statusEffects = [{ type: 'fire_ward', endTime: BIG, hp: 1500 }]; });
  say(t0 + 2.0, 'Giáp Lửa: khiên vỡ → nổ choáng'); at(t0 + 2.0, () => { ig.statusEffects = []; T.onFireWard({ kind: 'off', casterId: 'me', casterIdx: 0, targetId: 'op', stunned: [], radius: 4.5 }); });
  return t0 + 3.4;
}
let end = 0.2;
if (S === 'all') { end = seqAttack(end); end = seqMeteor(end); end = seqPillar(end); end = seqGod(end); end = seqWard(end); }
else end = ({ attack: seqAttack, meteor: seqMeteor, pillar: seqPillar, god: seqGod, ward: seqWard })[S](end);
say(end, '');
window.TOTAL = end + 0.3;
ev.sort((a, b) => a[0] - b[0]);
let t = 0;
window.stepTo = (target) => {
  while (t < target - 1e-9) {
    const dt = Math.min(1 / 60, target - t);
    while (ev.length && ev[0][0] <= t + 1e-9) ev.shift()[1]();
    t += dt; window.__vt = t; window.__runTimers();
    updateVfx(dt);
    [...vA, ...vF].forEach(v => v.update(dt, camera));
  }
  renderer.render(scene, camera);
  return t;
};
window.stepTo(0.02);
if (q.get('auto')) {
  let last = Date.now();
  const loop = () => { const now = Date.now(); window.stepTo(t + Math.min(0.05, (now - last) / 1000)); last = now; if (t > window.TOTAL) location.reload(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
window.__ready = true;
</script></body></html>
