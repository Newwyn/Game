<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#6d8f55}</style></head><body>
<!-- Xem từng tư thế của nhân vật 2D ghép mảnh. npm run dev rồi mở:
       /tools/preview-cutout.html?clip=attack&t=0.1,0.18,0.28   (nhiều thời điểm cạnh nhau)
     Tham số: zoom=1.5  cy=1.4 (độ cao nhìn)  gap=2 (khoảng cách)  debug=1 (hiện điểm khớp)
              skin=handN:seal,eye:happy   pose=[{"armN":0.5}] (tự chỉnh góc khớp để thử) -->
<script type="module">
import * as THREE from 'three';
import { buildCutout, setSkin } from '../src/characters/CutoutCharacterView.js';
const q = new URLSearchParams(location.search);
const W = 1400, H = 700;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(q.get('bg') ? '#' + q.get('bg') : 0x6d8f55);   // bg=000000 / ffffff: chụp chân dung (tách nền)
const cam = new THREE.PerspectiveCamera(30 / Number(q.get('zoom') || 1), W / H, 0.1, 100); const cy = Number(q.get('cy') || 1.4); cam.position.set(0, cy + 0.1, 9); cam.lookAt(0, cy, 0);

let rig, tex, mod;
{
  mod = await import(/* @vite-ignore */ q.get('rig') || '../src/characters/cutout/assassin2Rig.js');
  rig = mod.ASSASSIN_RIG;
  window.__rig = rig;
  tex = await new THREE.TextureLoader().loadAsync(rig.image);
  tex.colorSpace = THREE.SRGBColorSpace;
}

const clipName = q.get('clip') || 'idle';
const times = (q.get('t') || '0').split(',').map(Number);
const posesQ = q.get('pose') ? [].concat(JSON.parse(q.get('pose'))) : [];
const n = Math.max(times.length, posesQ.length, 1);
Array.from({ length: n }, (_, i) => times[i] ?? times[0]).forEach((t, i) => {
  const height = 2.9;
  const { root, parts, materials, skins } = buildCutout(rig, tex, height / rig.heightPx); window.__parts = parts;
  if (q.get('hide')) q.get('hide').split(',').forEach(k => { if (parts[k]) parts[k].visible = false; });   // hide=arrow: ẩn mảnh
  if (q.get('skin')) q.get('skin').split(',').forEach(kv => { const [k, v] = kv.split(':'); setSkin(skins, k, v); });
  materials.forEach(m => { m.alphaToCoverage = false; m.transparent = true; m.alphaTest = 0.1; });
  root.position.x = (i - (n - 1) / 2) * Number(q.get('gap') || 2.4);
  s.add(root);
  const clipFn = mod.CLIPS;
  const clips = clipFn(parts, height);
  const c = clips.find(c => c.name === clipName);
  const mixer = new THREE.AnimationMixer(root);
  if (c) { mixer.clipAction(c).play(); mixer.setTime(t); }
  if (mod?.SKIN_KEYS) {
    const want = { ...mod.DEFAULT_SKINS };
    (mod.SKIN_KEYS[clipName] ?? []).forEach(([tk, part, skin]) => { if (tk <= t + 1e-4) want[part] = skin; });
    Object.entries(want).forEach(([k, v]) => setSkin(skins, k, v));
  }
  if (q.get('skin')) q.get('skin').split(',').forEach(kv => { const [k, v] = kv.split(':'); setSkin(skins, k, v); });
  if (q.get('giant')) Object.keys(rig.parts).forEach(k => { if (rig.parts[k].skins?.giant) setSkin(skins, k, 'giant'); });   // giant=1: dạng khổng lồ (Brakk)
  // lò xo (tóc / vạt áo / dải lụa): ảnh tĩnh -> đặt ở thế cân bằng (rủ theo trọng lực)
  if (mod.SECONDARY && q.get('settle') !== '0') for (const [k, c] of Object.entries(mod.SECONDARY)) {
    const j = parts[k]; if (!j) continue;
    let pa = 0; for (let o = j.parent; o && o.name !== 'cutout_root' && o.parent; o = o.parent) pa += o.rotation.z;
    j.rotation.z = Math.max(c.limit?.[0] ?? -9, Math.min(c.limit?.[1] ?? 9, -(c.gravity ?? 0.7) * Math.atan2(Math.sin(pa), Math.cos(pa))));
  }
  if (posesQ[i]) for (const [k, v] of Object.entries(posesQ[i])) { const j = parts[k]; if (!j) continue; if (Array.isArray(v)) { j.position.x += v[0] * height; j.position.y += v[1] * height; } else j.rotation.z = v; }
  if (q.get('debug')) Object.values(parts).forEach(p => { const d = new THREE.Mesh(new THREE.CircleGeometry(0.03, 8), new THREE.MeshBasicMaterial({ color: 0xff0000, depthTest: false })); d.renderOrder = 99; p.add(d); });
});
r.render(s, cam); window.__done = true;
</script></body></html>
