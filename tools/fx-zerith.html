<!doctype html><html><body style="margin:0;background:#3c5a30">
<!-- Xem thử hiệu ứng Zerith theo từng mốc thời gian: npm run dev rồi mở /tools/fx-zerith.html (window.stepTo(giây) để tua) -->
<script type="module">
import * as THREE from 'three';
import { scene, camera, renderer } from '../src/core/scene.js';
import { updateVfx } from '../src/vfx/vfx.js';
import { createCharacterView } from '../src/characters/registry.js';
import { spawnPhantomScythe, spawnReapUp, spawnReapSlam } from '../src/vfx/zerithFx.js';
document.body.appendChild(renderer.domElement);
renderer.setSize(800, 450); camera.aspect = 800 / 450; camera.updateProjectionMatrix();
camera.position.set(1.2, 2.4, 9); camera.lookAt(1.2, 1.3, 0);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), new THREE.MeshLambertMaterial({ color: 0x6d8f55 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.5; scene.add(ground);
const member = { classId: 'reaper', alive: true, statusEffects: [], x: 0, z: 0, hp: 1, maxHp: 1, state: 'idle', skillCooldowns: [0, 0, 0], queuedSkills: [] };
const view = createCharacterView(member, { skills: [] }, true);
scene.add(view.root);
let t = 0;
const pos = () => view.position ?? view.root.position;
let ph = null;
const events = [
  [0.0, () => { view.playAction('charge', { hold: true }); ph = spawnPhantomScythe(pos, 1, { formTime: 0.7 }); ph.expectSlam(); }],
  [0.66, () => ph.swing()],
  [0.62, () => view.playAction('reap', { onHit: () => spawnReapUp({ x: 1.6, z: 0 }, 1, { size: 3.2 }) })],
  [1.21, () => ph.slam()],
  [1.12, () => view.playAction('slam', { onHit: () => spawnReapSlam({ x: 1.6, z: 0 }, 1, { size: 3.2 }) })],
].sort((a, b) => a[0] - b[0]);
window.stepTo = (target) => {
  while (t < target) {
    const dt = Math.min(1 / 60, target - t);
    while (events.length && events[0][0] <= t) events.shift()[1]();
    t += dt; updateVfx(dt); view.updateVisual(dt, camera);
  }
  renderer.render(scene, camera);
  return t;
};
window.stepTo(0.05); window.__ready = true;
</script></body></html>
