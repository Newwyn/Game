<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thử Rok khung mượt</title>
<!-- Trang THỬ (cách 1): giữ tranh từng khung Rok bản 3, làm mượt hơn bằng khung chen giữa (Codex vẽ) + nhịp khung có
     lấy đà / khựng khi trúng + vệt chém + đổi skin bằng màu. Đặt cạnh bản hiện tại để so.
     Chạy `npm run dev` rồi mở http://localhost:5173/tools/thu-rok-khung.html  · ?zoom=1.6 phóng to · ?ui=0 ẩn nút
     Atlas thử: python tools/sprite_pack.py art/rok/sprite/sprite_spec_thu.json -> src/assets/sprites/rok_sprite_thu.webp -->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1d2a33;font-family:system-ui,"Segoe UI",sans-serif}
  canvas{display:block}
  #panel{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(1000px,calc(100% - 24px));
    background:rgba(16,22,30,.86);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;color:#e9eef3;
    box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0}
  .lbl{width:84px;font-size:13px;color:#9fb0bf;font-weight:600}
  button{font:600 13px system-ui,"Segoe UI",sans-serif;color:#e9eef3;background:#2a3846;border:1px solid #3b4d5f;border-radius:8px;padding:6px 11px;cursor:pointer}
  button:hover{background:#34475a}
  button.on{background:#e8b84a;color:#1c1405;border-color:#f3cf74}
  .tag{position:fixed;color:#fff;font:700 14px system-ui;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:6px;transform:translateX(-50%);white-space:nowrap}
  #title{position:fixed;top:12px;left:50%;transform:translateX(-50%);color:#fff;font-weight:700;font-size:15px;background:rgba(0,0,0,.45);padding:6px 14px;border-radius:20px;white-space:nowrap}
  @media (max-width:700px){.lbl{width:100%}}
</style></head>
<body>
<div id="title">Rok bản 3 · làm mượt tranh từng khung (thử nghiệm)</div>
<div class="tag" id="tagOld">HIỆN TẠI · 8 khung</div>
<div class="tag" id="tagNew">MỚI · 16 khung + nhịp mới</div>
<div id="panel">
  <div class="row"><span class="lbl">Động tác</span>
    <button id="aIdle" class="on">Đứng thủ thế</button><button id="aAtk">Chém 1 lần</button><button id="aLoop">Chém liên tục</button></div>
  <div class="row"><span class="lbl">Skin (mới)</span><span id="skins" class="row" style="margin:0"></span></div>
  <div class="row"><span class="lbl">Xem</span>
    <button id="spd1" class="on">Tốc độ thường</button><button id="spd05">Chậm ½</button><button id="spd025">Rất chậm ¼</button>
    <button id="fxBtn" class="on">Vệt chém + loé</button></div>
</div>
<script type="module">
import * as THREE from 'three';
import { scene, camera, renderer } from '../src/core/scene.js';
import imgOld from '../src/assets/sprites/rok_sprite.webp';
import metaOld from '../src/characters/sprite/rokSprite.json';
import imgNew from '../src/assets/sprites/rok_sprite_thu.webp';
import metaNew from '../src/characters/soft/rokSpriteThu.json';
import { Particles } from '../src/characters/soft/softFx.js';

const Q = new URLSearchParams(location.search);
const ZOOM = +(Q.get('zoom') || 1);
if (Q.get('ui') === '0') document.getElementById('panel').style.display = 'none';
const GROUND = -0.5, HEIGHT = 2.6, OLD_X = -1.9, NEW_X = 1.9;
document.body.appendChild(renderer.domElement);
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---------- Đổi màu skin trên tranh khung (vải xanh hoàng gia -> màu khác, giáp bạc -> tối / vàng) ----------
const skinU = { uClothHue: { value: 0 }, uClothSat: { value: 1 }, uClothVal: { value: 1 },
  uMetalTint: { value: new THREE.Color(1, 1, 1) }, uMetalMix: { value: 0 }, uFlash: { value: 0 } };
const SKINS = {
  goc:    { label: 'Gốc · Xanh hoàng gia', hue: 0, sat: 1, val: 1, metal: [1, 1, 1], mix: 0 },
  hongNgoc: { label: 'Hồng Ngọc · Đỏ', hue: 0.345, sat: 1.15, val: 0.85, metal: [1, 1, 1], mix: 0 },
  lucBao: { label: 'Lục Bảo · Xanh lá', hue: -0.27, sat: 0.95, val: 0.85, metal: [0.95, 1.0, 0.95], mix: 0.15 },
  hacKy:  { label: 'Hắc Kỵ Sĩ', hue: 0.13, sat: 0.75, val: 0.55, metal: [0.4, 0.42, 0.5], mix: 0.85 },
};
const HSV = `vec3 sr_rgb2hsv(vec3 c){vec4 K=vec4(0.,-1./3.,2./3.,-1.);vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));
vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));float d=q.x-min(q.w,q.y);float e=1e-10;
return vec3(abs(q.z+(q.w-q.y)/(6.*d+e)),d/(q.x+e),q.x);}
vec3 sr_hsv2rgb(vec3 c){vec4 K=vec4(1.,2./3.,1./3.,3.);vec3 p=abs(fract(c.xxx+K.xyz)*6.-K.www);return c.z*mix(K.xxx,clamp(p-K.xxx,0.,1.),c.y);}`;
function skinPatch(mat) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, skinU);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>\n${HSV}\nuniform float uClothHue,uClothSat,uClothVal,uMetalMix,uFlash; uniform vec3 uMetalTint;`)
      .replace('#include <map_fragment>', `#include <map_fragment>
{
  vec3 hsv = sr_rgb2hsv(diffuseColor.rgb);
  // vải xanh hoàng gia (áo choàng, viền khiên): sắc độ ~0.58-0.70, đậm màu
  float blue = smoothstep(0.53, 0.58, hsv.x) * (1.0 - smoothstep(0.70, 0.75, hsv.x)) * smoothstep(0.25, 0.45, hsv.y);
  vec3 c2 = sr_hsv2rgb(vec3(fract(hsv.x + uClothHue), clamp(hsv.y * uClothSat, 0., 1.), hsv.z * uClothVal));
  diffuseColor.rgb = mix(diffuseColor.rgb, c2, blue);
  float grey = (1.0 - smoothstep(0.18, 0.32, hsv.y)) * smoothstep(0.25, 0.5, hsv.z);
  float lum = dot(diffuseColor.rgb, vec3(0.299, 0.587, 0.114));
  diffuseColor.rgb = mix(diffuseColor.rgb, uMetalTint * (0.2 + 1.0 * lum), grey * uMetalMix);
  diffuseColor.rgb += uFlash;   // loé trắng khi ra đòn
}`);
  };
  mat.customProgramCacheKey = () => 'rok-khung-skin';
}

// ---------- Nhân vật tranh từng khung ----------
function makeSprite(img, meta, x, patch) {
  const tex = new THREE.TextureLoader().load(img); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const mat = new THREE.MeshBasicMaterial({ map: tex, alphaToCoverage: true, side: THREE.DoubleSide, fog: false });
  if (patch) skinPatch(mat);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat); mesh.frustumCulled = false;
  const root = new THREE.Group(); root.position.set(x, GROUND, 0); root.add(mesh); scene.add(root);
  const tops = Object.keys(meta.frames).filter(k => /^idle\d/.test(k)).map(k => meta.frames[k].top).sort((a, b) => a - b);
  const U = HEIGHT / tops[tops.length >> 1];
  let cur = '';
  return { root, mesh, setFrame(name) {
    if (name === cur) return; const f = meta.frames[name]; if (!f) return; cur = name;
    const [W, H] = meta.size, [fx, fy, w, h] = f.rect, [ox, oy] = f.org;
    const x0 = -ox * U, x1 = (w - ox) * U, y1 = oy * U, y0 = (oy - h) * U, g = mesh.geometry;
    g.attributes.position.array.set([x0, y1, 0, x1, y1, 0, x0, y0, 0, x1, y0, 0]); g.attributes.position.needsUpdate = true;
    g.attributes.uv.array.set([fx / W, 1 - fy / H, (fx + w) / W, 1 - fy / H, fx / W, 1 - (fy + h) / H, (fx + w) / W, 1 - (fy + h) / H]); g.attributes.uv.needsUpdate = true;
  }, get frame() { return cur; } };
}
const oldR = makeSprite(imgOld, metaOld, OLD_X, false);
const newR = makeSprite(imgNew, metaNew, NEW_X, true);

// ---------- Nhịp khung ----------
// HIỆN TẠI: giống game (mode strike): khung 1-4 chia đều tới mốc trúng 0,24s, khung 5-8 chia đều phần còn lại (0,66s)
const OLD_SEQ = [['attack1', .08], ['attack2', .08], ['attack3', .08], ['attack4', .105], ['attack5', .105], ['attack6', .105], ['attack7', .105], ['attack8', .1]];
// MỚI: 16 khung (8 cũ + 8 chen giữa), giữ lâu ở thế lấy đà, vung CỰC NHANH qua 3 khung giữa, khựng ở khung trúng, thu về êm
const NEW_SEQ = [['attack1', .05], ['mid1', .05], ['attack2', .06], ['attack3', .11], ['mid2', .03], ['mid3', .025], ['mid4', .025],
  ['attack4', .07, 'hit'], ['mid5', .055], ['attack5', .06], ['attack6', .08], ['mid6', .05], ['attack7', .05], ['mid7', .05], ['attack8', .06], ['mid8', .09]];
const HITSTOP = 0.07;
const has = (n) => !!metaNew.frames[n];

const IDLE_OLD = ['ready1', 'ready2', 'ready3', 'ready4'];
class Player {
  constructor(r, seq, isNew) { this.r = r; this.seq = seq.filter(s => r === oldR || has(s[0])); this.isNew = isNew; this.state = 'idle'; this.t = 0; this.i = 0; this.freeze = 0; }
  attack() { this.state = 'atk'; this.t = 0; this.i = 0; this.freeze = 0; this.hitDone = false; }
  update(dt, onHit) {
    if (this.state === 'idle') {
      this.t += dt;
      this.r.setFrame(this.isNew && !has('ready1') ? 'attack1' : IDLE_OLD[Math.floor(this.t * 3) % 4]);
      return;
    }
    if (this.freeze > 0) { this.freeze -= dt; return; }
    this.t += dt;
    while (this.i < this.seq.length && this.t >= this.seq[this.i][1]) { this.t -= this.seq[this.i][1]; this.i++;
      const s = this.seq[this.i]; if (s && s[2] === 'hit') { this.freeze = this.isNew ? HITSTOP : 0; onHit?.(this); } }
    if (this.i >= this.seq.length) { this.state = 'idle'; this.t = 0; if (loopAtk) this.attack(); return; }
    this.r.setFrame(this.seq[this.i][0]);
  }
}
const pOld = new Player(oldR, OLD_SEQ.map(s => s[0] === 'attack4' ? [...s, 'hit'] : s), false);
const pNew = new Player(newR, NEW_SEQ, true);

// ---------- Hiệu ứng: vệt chém hình trăng khuyết + loé + tia lửa ----------
const fx = new Particles(scene);
let fxOn = true, flash = 0, shake = 0, squash = 0;
function arcTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512; const g = c.getContext('2d');
  // trăng khuyết: quét dày đặc nhiều nét mảnh chồng lên nhau -> dải mịn, không sọc; đầu vệt (phía mũi kiếm) dày + sáng, đuôi mảnh + mờ
  g.globalCompositeOperation = 'lighter';
  const N = 420;
  for (let i = 0; i < N; i++) {
    const u = i / (N - 1), a0 = -Math.PI * 0.6 + u * Math.PI * 1.0;
    const w = 4 + 40 * Math.sin(Math.PI * Math.min(1, u * 1.15)) * Math.pow(u, 0.7);
    g.strokeStyle = `rgba(255,255,255,${0.03 + 0.16 * Math.pow(u, 1.8)})`;
    g.lineWidth = w;
    g.beginPath(); g.arc(256, 256, 205 - w * 0.35, a0, a0 + 0.02); g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const arcMat = new THREE.MeshBasicMaterial({ map: arcTexture(), color: 0xcfe4ff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, opacity: 0 });
const arc = new THREE.Mesh(new THREE.PlaneGeometry(3.1, 3.1), arcMat); arc.renderOrder = 40; scene.add(arc);
let arcT = 9;
function onHitNew(p) {
  if (!fxOn) return;
  arcT = 0; flash = 0.35; shake = 0.12; squash = 1;
  fx.burst(new THREE.Vector3(NEW_X + 1.35, GROUND + 0.95, 0.2), 0xfff2c0, 1, 16);
  fx.dust(new THREE.Vector3(NEW_X + 0.6, GROUND, 0.1), 4);
}

// ---------- Nút ----------
let speed = 1, loopAtk = false, curSkin = 'goc';
const $ = (id) => document.getElementById(id);
function setSkin(k) { const s = SKINS[k]; curSkin = k;
  skinU.uClothHue.value = s.hue; skinU.uClothSat.value = s.sat; skinU.uClothVal.value = s.val; skinU.uMetalTint.value.setRGB(...s.metal); skinU.uMetalMix.value = s.mix; refresh(); }
const skinBtns = Object.entries(SKINS).map(([k, v]) => { const b = document.createElement('button'); b.textContent = v.label; b.dataset.k = k; b.onclick = () => setSkin(k); $('skins').appendChild(b); return b; });
let mode = 'idle';
$('aIdle').onclick = () => { mode = 'idle'; loopAtk = false; pOld.state = pNew.state = 'idle'; refresh(); };
$('aAtk').onclick = () => { mode = 'atk'; loopAtk = false; pOld.attack(); pNew.attack(); refresh(); };
$('aLoop').onclick = () => { mode = 'loop'; loopAtk = true; pOld.attack(); pNew.attack(); refresh(); };
const spd = { 1: $('spd1'), 0.5: $('spd05'), 0.25: $('spd025') };
for (const [v, b] of Object.entries(spd)) b.onclick = () => { speed = +v; refresh(); };
$('fxBtn').onclick = () => { fxOn = !fxOn; refresh(); };
function refresh() {
  $('aIdle').classList.toggle('on', mode === 'idle'); $('aAtk').classList.toggle('on', mode === 'atk'); $('aLoop').classList.toggle('on', mode === 'loop');
  skinBtns.forEach(b => b.classList.toggle('on', b.dataset.k === curSkin));
  for (const [v, b] of Object.entries(spd)) b.classList.toggle('on', +v === speed);
  $('fxBtn').classList.toggle('on', fxOn);
}

// ---------- Vòng lặp ----------
let time = 0, paused = false;
const clock = new THREE.Clock();
function tick(realDt) {
  const dt = realDt * speed; time += dt;
  pOld.update(dt); pNew.update(dt, onHitNew);
  // thở nhẹ khi đứng (chỉ bản mới: co giãn quanh bàn chân) + nhún khi chém trúng
  squash = Math.max(0, squash - dt * 6);
  const breath = pNew.state === 'idle' ? Math.sin(time * 2.6) * 0.008 : 0;
  newR.root.scale.set(1 + squash * 0.035, 1 + breath - squash * 0.045, 1);
  flash = Math.max(0, flash - dt * 6); skinU.uFlash.value = flash * 0.3;
  // vệt chém quanh vai, quét từ trên xuống trước mặt
  arcT += dt; const u = arcT / 0.16;
  arcMat.opacity = u < 1 ? (1 - u) * 0.95 : 0;
  arc.position.set(NEW_X + 0.55, GROUND + 1.25, 0.15); arc.rotation.z = -0.35 - u * 0.25; arc.scale.setScalar(0.9 + u * 0.15);
  fx.update(dt);
  shake = Math.max(0, shake - realDt * 0.9);
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  const narrow = camera.aspect < 1;
  camera.fov = 30 / ZOOM; camera.updateProjectionMatrix();
  camera.position.set(sx, 1.05 + sy, narrow ? 10 * 1.6 / camera.aspect : 11);
  camera.lookAt(sx * 0.5, ZOOM > 1 ? 0.75 : narrow ? -3 : 0.3, 0);
  const tag = (el, x) => { const v = new THREE.Vector3(x, GROUND + HEIGHT + 0.4, 0).project(camera); el.style.left = (v.x + 1) / 2 * innerWidth + 'px'; el.style.top = Math.max(48, (1 - v.y) / 2 * innerHeight - 30) + 'px'; };
  tag($('tagOld'), OLD_X); tag($('tagNew'), NEW_X);
  renderer.render(scene, camera);
}
function frame() { requestAnimationFrame(frame); const d = Math.min(clock.getDelta(), 1 / 20); if (!paused) tick(d); }
setSkin('goc');
window.__rok = { step: (dt, n = 1) => { paused = true; for (let i = 0; i < n; i++) tick(dt); return pNew.i; }, resume: () => { paused = false; },
  atk: () => { pOld.attack(); pNew.attack(); }, setSkin, newR, oldR };
frame();
</script>
</body></html>
