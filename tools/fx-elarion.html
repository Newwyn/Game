<!doctype html><html><body style="margin:0;background:#2f4a5a">
<!-- Xem thử kỹ năng / hiệu ứng Elarion + Golem theo từng mốc thời gian (gọi đúng hàm xử lý sự kiện của game với dữ liệu giả):
     npm run dev rồi mở /tools/fx-elarion.html?s=auto
     s = auto | book | storm | meteor | frost | chain | ward | tornado | steam | firebolt | beams | haste | frozen | gems
         golem | fist | blizzard | aura
     window.stepTo(giây) để tua -->
<script>
  // Đồng hồ ảo: setTimeout + performance.now chạy theo stepTo() để chụp đúng khoảnh khắc
  window.__vt = 0; const __timers = []; let __tid = 1;
  window.setTimeout = (fn, ms = 0) => { const id = __tid++; __timers.push({ id, at: window.__vt + (ms || 0) / 1000, fn }); return id; };
  window.clearTimeout = (id) => { const i = __timers.findIndex(t => t.id === id); if (i >= 0) __timers.splice(i, 1); };
  window.__runTimers = () => { for (;;) { __timers.sort((a, b) => a.at - b.at); if (!__timers.length || __timers[0].at > window.__vt) break; __timers.shift().fn(); } };
  const __pn = performance.now.bind(performance); performance.now = () => 1 + window.__vt * 1000;
</script>
<script type="module">
import * as THREE from 'three';
import { scene, camera, renderer } from '../src/core/scene.js';
import { updateVfx } from '../src/vfx/vfx.js';
import { timeState } from '../src/config.js';
import { game } from '../src/state.js';
import { createCharacterView } from '../src/characters/registry.js';
import { __fxTest } from '../src/combat/events.js';
import { makeGem, makeHoverRing } from '../src/vfx/elemFx.js';
timeState.clock = 0; timeState.recvAt = 1; timeState.scale = 1;
const q = new URLSearchParams(location.search);
const S = q.get('s') || 'auto';
document.body.appendChild(renderer.domElement);
renderer.setSize(900, 500); camera.aspect = 900 / 500; camera.updateProjectionMatrix();
camera.position.set(1.5, 3.0, 11); camera.lookAt(1.5, 2.0, 0);
if (q.get('zoom')) { const zx = +(q.get('zx') ?? -3); camera.position.set(zx, 2.4, 6.5); camera.lookAt(zx, 1.9, 0); }
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshLambertMaterial({ color: 0x6d8f55 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.5; scene.add(ground);
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const mk = (classId, x, side, z = 0) => ({ classId, alive: true, statusEffects: [], x, z, hp: 100, maxHp: 100, mp: 3000, maxMp: 5000, state: 'idle', side,
  skillCooldowns: [0, 0, 0], queuedSkills: [], targetIndex: 0, held: ['f', 'i', 'b'] });
const ela = mk('elementalist', -4, 'left');
const golem = mk('elem_golem', ['golem', 'fist', 'blizzard', 'aura'].includes(S) ? -0.5 : -60, 'left', 0.6);
const allies = [ela, mk('warrior', -6.5, 'left', -1.2), golem];
const foes = [mk('monster_tank', 4.5, 'right'), mk('monster_archer', 7, 'right', -1), mk('monster_supporter', 6, 'right', 1.2)];
game.roomData = { players: { me: { squad: allies }, op: { squad: foes } } };
game.classDefs = { elementalist: { skills: [{ type: 'elem_book' }, { type: 'elem_spell' }, { type: 'elem_storm' }] }, elem_golem: { skills: [] }, warrior: { skills: [] },
  monster_tank: { skills: [] }, monster_archer: { skills: [] }, monster_supporter: { skills: [] } };
const vA = allies.map(m => createCharacterView(m, game.classDefs[m.classId], true));
const vF = foes.map(f => createCharacterView(f, { skills: [] }, false));
vF.forEach(v => { v.facingLeft = true; });
game.views = { me: vA, op: vF };
[...vA, ...vF].forEach(v => scene.add(v.root));
const showGolem = ['golem', 'fist', 'blizzard', 'aura'].includes(S);
const ev = [];
const at = (t, fn) => ev.push([t, fn]);
const hits = (list, extra = {}) => list.map((e) => ({ targetIndex: e[0], damage: e[1], isCrit: false, isBlock: false, isMiss: false, ...extra, ...e[2] }));
const BIG = 1e9;
const spell = (key, payload, effects = []) => __fxTest.onSkillExecuted({ casterId: 'me', casterIdx: 0, skillIdx: 1, type: 'elem_spell', spell: key, effects, ...payload });
const fx = (d) => __fxTest.onElemFx({ casterId: 'me', casterIdx: 0, targetId: 'op', ...d });

if (S === 'auto') {
  ['f', 'i', 'b'].forEach((el, k) => at(0.1 + k * 0.7, () => { ela.held = [el]; __fxTest.onAutoAttack({ attackerId: 'me', attackerIndex: 0, targetId: 'op', targetIndex: 0, damage: 212, isCrit: false }); }));
}
if (S === 'book') at(0.1, () => __fxTest.onSkillExecuted({ casterId: 'me', casterIdx: 0, skillIdx: 0, type: 'elem_book', recipe: ['f', 'i', 'b'], spell: 'golem', effects: [] }));
if (S === 'storm') at(0.1, () => __fxTest.onSkillExecuted({ casterId: 'me', casterIdx: 0, skillIdx: 2, type: 'elem_storm', effects: [] }));
if (S === 'meteor') {
  at(0.1, () => spell('meteor', { meteor: { x: 5, z: 0, xEnd: 18, fall: 800, rollTime: 3000, trailTime: 3500, radius: 4 } }));
  at(0.95, () => fx({ kind: 'meteorHit', effects: hits([[0, 420], [1, 380], [2, 360]]) }));
}
if (S === 'frost') {
  at(0.1, () => spell('frost', { frost: { x: 5.5, z: 0, form: 1500, fall: 300, start: 300, shards: [{ x: 3, z: 1 }, { x: 8, z: -1 }, { x: 6, z: 1.5 }, { x: 4.5, z: -1.5 }, { x: 7, z: 0.5 }] } }));
  at(2.15, () => fx({ kind: 'frostHit', effects: hits([[0, 220], [1, 200], [2, 210]]) }));
}
if (S === 'chain') at(0.1, () => spell('chain', { chain: [0, 1, 2, 0, 2] }, hits([[0, 300, { delay: 300 }], [1, 280, { delay: 420 }], [2, 260, { delay: 540 }]])));
if (S === 'ward') at(0.1, () => { spell('ward', { shields: [{ targetIndex: 0, shield: 250 }, { targetIndex: 1, shield: 320 }] }); ela.statusEffects.push({ type: 'storm_ward', endTime: BIG, hp: 200, maxHp: 250 }); });
if (S === 'tornado') at(0.1, () => spell('tornado', { tornado: { x0: -3, z0: 0, ux: 1, uz: 0, length: 12, travel: 900 } }, hits([[0, 180, { delay: 500 }], [1, 160, { delay: 700 }]])));
if (S === 'steam') {
  at(0.1, () => { vA[0].setLocomotion('channel'); spell('steam', { rain: { x: 2, z: 0, duration: 7000 } }); });
  at(1.2, () => fx({ kind: 'rainTick', heals: [{ targetIndex: 0, heal: 80 }, { targetIndex: 1, mana: 200 }], strike: { targetIndex: 1, damage: 120, isCrit: false } }));
}
// Bóng Nguyên Tố (lúc Bão Nguyên Tố): bóng hiện ở chỗ Elarion đứng, Elarion lùi 4 ô; bóng niệm rồi thi triển (mốc như server)
if (S === 'shadow') {
  at(0.1, () => { ela.statusEffects.push({ type: 'elem_storm', endTime: BIG }); __fxTest.onSkillExecuted({ casterId: 'me', casterIdx: 0, skillIdx: 2, type: 'elem_storm', effects: [] }); });
  at(1.0, () => { fx({ kind: 'shadowStart', spell: 'steam', x: -4, z: 0, fromX: -4, fromZ: 0, toX: -8, toZ: 0, retreatTime: 350, castTime: 2000 }); ela.x = -8;
    spell('steam', { rain: { x: -4, z: 0, duration: 7000, shadow: { x: -4, z: 0 }, delay: 2000 } }); });
  for (let k = 1; k <= 7; k++) at(3.0 + k, () => fx({ kind: 'rainTick', shadow: true, heals: [{ targetIndex: 0, heal: 80 }, { targetIndex: 1, mana: 200 }], strike: { targetIndex: k % 3, damage: 120, isCrit: false } }));
  at(10.1, () => { fx({ kind: 'rainEnd', reason: 'time', shadow: true }); fx({ kind: 'shadowEnd' }); });
}
if (S === 'shadowbeam') {
  at(0.1, () => { ela.statusEffects.push({ type: 'elem_storm', endTime: BIG }); __fxTest.onSkillExecuted({ casterId: 'me', casterIdx: 0, skillIdx: 2, type: 'elem_storm', effects: [] }); });
  at(1.0, () => { fx({ kind: 'shadowStart', spell: 'beams', x: -4, z: 0, fromX: -4, fromZ: 0, toX: -8, toZ: 0, retreatTime: 350, castTime: 700 }); ela.x = -8;
    spell('beams', { beam: { ux: 1, uz: 0, charge: 700, duration: 10000, every: 1000, max: 5, len: 50, shadow: { x: -4, z: 0 } } }); });
  for (let k = 1; k <= 10; k++) at(1.7 + (k - 0.5), () => { const st = Math.min(5, k); fx({ kind: 'beamTick', shadow: true, tick: k, stacks: st, big: st >= 5,
    ice: hits([[0, 90], [1, 85], [2, 88]], { chill: k }), fire: hits([[0, 140 + k * 8], [1, 130 + k * 8], [2, 135 + k * 8]], { delay: 150 }) }); });
  at(11.75, () => { fx({ kind: 'beamEnd', reason: 'time', shadow: true }); fx({ kind: 'shadowEnd' }); });
}
if (S === 'firebolt') {
  at(0.1, () => spell('firebolt', { firebolt: { x: 5.5, z: 0, grow: 2000, start: 300, radius: 4.5 } }));
  at(2.3, () => fx({ kind: 'fireboltHit', x: 5.5, z: 0, radius: 4.5, effects: hits([[0, 400], [1, 380]]) }));
}
if (S === 'beams') {
  // SolarBeam: dồn lực 0,7s -> chưởng 10s (mỗi giây 1 nhịp: băng + lửa, đủ 5 tầng tia lửa to) -> tắt
  const uz = +(q.get('uz') ?? 0);   // &uz=0.3: tia chéo vào sâu
  at(0.1, () => spell('beams', { beam: { ux: Math.sqrt(1 - uz * uz), uz, charge: 700, duration: 10000, every: 1000, max: 5, len: 50 } }));
  for (let k = 1; k <= 10; k++) at(0.8 + (k - 0.5), () => { const st = Math.min(5, k); fx({ kind: 'beamTick', tick: k, stacks: st, big: st >= 5,
    ice: hits([[0, 90], [1, 85], [2, 88]], { chill: k }), fire: hits([[0, 140 + k * 8], [1, 130 + k * 8], [2, 135 + k * 8]], { delay: 150 }) }); });
  at(10.85, () => fx({ kind: 'beamEnd', reason: 'time' }));
}
if (S === 'haste') {
  at(0.1, () => { spell('haste', {}); ela.statusEffects.push({ type: 'storm_self', endTime: BIG }); });
  at(0.9, () => { ela.held = ['b']; __fxTest.onAutoAttack({ attackerId: 'me', attackerIndex: 0, targetId: 'op', targetIndex: 0, damage: 212, isCrit: false }); });
  at(1.1, () => fx({ kind: 'echoHit', targetIndex: 0, effect: { targetIndex: 0, damage: 120, delay: 0 } }));
}
if (S === 'frozen') at(0.1, () => { foes[0].statusEffects.push({ type: 'frozen', endTime: BIG }, { type: 'stun', endTime: BIG }); foes[0].state = 'stunned'; });
if (S === 'gems') {
  ['f', 'i', 'b'].forEach((el, k) => { const g = makeGem(el, 0.5); g.group.position.set(-5.2 + k * 1.2, 3.9, 0.6); scene.add(g.group); });
  const hr = makeHoverRing(0.5); hr.group.position.set(-2.8, 3.9, 0.6); scene.add(hr.group);
  const g2 = makeGem('i', 0.5); g2.group.position.set(-2.8, 3.9, 0.6); scene.add(g2.group);
}
// ---- Golem ----
const gfx = (d) => __fxTest.onElemFx({ casterId: 'me', casterIdx: 2, targetId: 'op', ...d });
const gskill = (type, payload) => __fxTest.onSkillExecuted({ casterId: 'me', casterIdx: 2, skillIdx: 0, type, effects: [], ...payload });
if (S === 'golem') { at(0.05, () => gfx({ kind: 'golemSummon', x: -0.5, z: 0.6 })); at(0.1, () => vA[2].playAction('summon')); }
if (S === 'fist') {
  at(0.1, () => gskill('golem_fist', { fist: { backX: -3, backZ: 0.6, backTime: 500, channel: 1000, fromX: -3, fromZ: 0.6, toX: 4, toZ: 0, time: 1200 } }));
  at(1.6, () => gfx({ kind: 'fistDash', fromX: -3, fromZ: 0.6, toX: 4, toZ: 0, time: 1200, effects: hits([[0, 300, { delay: 1000 }]]) }));
}
if (S === 'blizzard') {
  at(0.1, () => { vA[2].playAction('inhale', { hold: true }); });
  at(1.2, () => gskill('golem_blizzard', { blizzard: { ticks: 6, gap: 1000, start: 0 } }));
}
if (S === 'aura') { at(0.1, () => { gskill('golem_aura', {}); golem.statusEffects.push({ type: 'golem_haste', endTime: BIG }); }); }
ev.sort((a, b) => a[0] - b[0]);
let t = 0;
window.stepTo = (target) => {
  while (t < target) {
    const dt = Math.min(1 / 60, target - t);
    while (ev.length && ev[0][0] <= t) ev.shift()[1]();
    t += dt; window.__vt = t; window.__runTimers();
    updateVfx(dt);
    [...vA, ...vF].forEach(v => v.update(dt, camera));
  }
  renderer.render(scene, camera);
  return t;
};
window.stepTo(0.02); window.__ready = true;
</script></body></html>
