<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#2f4a5a;overflow:hidden}
#lbl{position:fixed;left:10px;top:8px;font:bold 18px sans-serif;color:#ffe680;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:4px}#lbl:empty{display:none}</style></head><body><div id="lbl"></div>
<!-- Xem thử MỌI kỹ năng + hiệu ứng của Lyra bản 3 (gọi đúng hàm xử lý sự kiện của game với dữ liệu giả, mốc thời gian như server).
     PHẢI chạy `npm run dev` rồi mở http://localhost:5173/tools/fx-lyra.html?s=all&auto=1
     s = all (lần lượt tất cả) | attack | snipe | wind | arrows
     &w=1280&h=720 cỡ khung · &auto=1 tự chạy lặp · &lyra=cutout bản khung xương · console: stepTo(giây) -->
<script>
  window.__vt = 0; const __timers = []; let __tid = 1;
  window.setTimeout = (fn, ms = 0) => { const id = __tid++; __timers.push({ id, at: window.__vt + (ms || 0) / 1000, fn }); return id; };
  window.clearTimeout = (id) => { const i = __timers.findIndex(t => t.id === id); if (i >= 0) __timers.splice(i, 1); };
  window.__runTimers = () => { for (;;) { __timers.sort((a, b) => a.at - b.at); if (!__timers.length || __timers[0].at > window.__vt) break; __timers.shift().fn(); } };
  performance.now = () => 1 + window.__vt * 1000;
</script>
<script type="module">
import * as THREE from 'three';
import { scene, camera, renderer } from '../src/core/scene.js';
import { updateVfx } from '../src/vfx/vfx.js';
import { timeState } from '../src/config.js';
import { game } from '../src/state.js';
import { createCharacterView } from '../src/characters/registry.js';
import { __fxTest as T } from '../src/combat/events.js';
timeState.clock = 0; timeState.recvAt = 1; timeState.scale = 1;
const q = new URLSearchParams(location.search);
const S = q.get('s') || 'all';
const W = +(q.get('w') || 1280), H = +(q.get('h') || 720);
document.body.appendChild(renderer.domElement);
renderer.setSize(W, H); camera.aspect = W / H; camera.fov = 34; camera.updateProjectionMatrix();
const CX = +(q.get('cx') ?? 1.0), CY = +(q.get('cy') ?? 2.0), CZ = +(q.get('cz') ?? 18);
camera.position.set(CX, CY + 2.7, CZ); camera.lookAt(CX, CY, 0);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshLambertMaterial({ color: 0x6d8f55 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.5; scene.add(ground);
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const mk = (classId, x, side, z = 0) => ({ classId, alive: true, statusEffects: [], x, z, hp: 100, maxHp: 100, mp: 3000, maxMp: 5000, state: 'idle', side,
  skillCooldowns: [0, 0, 0], queuedSkills: [], targetIndex: 0 });
const lyra = mk('archer', -3.4, 'left');
const ally = mk('warrior', -0.6, 'left', -1.2);
const allies = [lyra, ally];
const foes = [mk('monster_tank', 3.6, 'right'), mk('monster_archer', 7.0, 'right', -1), mk('monster_supporter', 5.8, 'right', 1.2)];
game.roomData = { players: { me: { squad: allies }, op: { squad: foes } } };
game.classDefs = { archer: { skills: [{ type: 'snipe', hitFrame: 2 }, { type: 'wind_spirit', hitFrame: 2 }, { type: 'charged_shot', hitFrame: 2, castTime: 2000 }] },
  warrior: { skills: [] }, monster_tank: { skills: [] }, monster_archer: { skills: [] }, monster_supporter: { skills: [] } };
const vA = allies.map(m => createCharacterView(m, game.classDefs[m.classId], true));
const vF = foes.map(f => createCharacterView(f, { skills: [] }, false));
vF.forEach(v => { v.facingLeft = true; });
game.views = { me: vA, op: vF };
[...vA, ...vF].forEach(v => scene.add(v.root));
window.view = vA[0];

const lbl = document.getElementById('lbl');
const ev = [];
const at = (t, fn) => ev.push([t, fn]);
const say = (t, s) => at(t, () => { lbl.textContent = s; });
const BIG = 1e12;
const hit = (i, dmg = 180, extra = {}) => ({ targetIndex: i, damage: dmg, isCrit: false, isBlock: false, isMiss: false, ...extra });
const exec = (skillIdx, type, payload = {}) => T.onSkillExecuted({ casterId: 'me', casterIdx: 0, skillIdx, type, effects: [], ...payload });
const attack = (ti = 0, isCrit = false) => T.onAutoAttack({ attackerId: 'me', attackerIndex: 0, targetId: 'op', targetIndex: ti, damage: isCrit ? 420 : 210, isCrit });
const shots = (list) => T.onArcherShots({ casterId: 'me', casterIdx: 0, targetIndex: 0, shots: list });
const resetAll = () => { vA[0].teleport(lyra.x, 0, true); lyra.statusEffects = []; lyra.state = 'idle'; foes.forEach((f, i) => { vF[i].teleport(f.x, f.z, true); }); };

function seqAttack(t0) {
  say(t0, 'Đánh thường: kéo cung → nhả tên gió → trúng'); at(t0, () => attack(0));
  say(t0 + 1.1, 'Phong Tiễn (phát thứ 3): mũi gió xuyên cả hàng quái');
  at(t0 + 1.1, () => attack(0));
  at(t0 + 1.45, () => shots([{ by: 'lyra', kind: 'pierce', dir: 1, effects: [hit(0, 140), hit(2, 140), hit(1, 140)] }]));
  return t0 + 2.6;
}
function seqSnipe(t0) {
  say(t0, 'Tiễn Gió Chớp: dấu ngắm → nhảy lùi → tên gió chớp → nổ gió đẩy lùi (hạ gục: hồi chiêu)');
  at(t0, () => exec(0, 'snipe', { newX: lyra.x - 3, newZ: 0, effects: [hit(0, 480, { isCrit: true, knockback: true, toX: foes[0].x + 2, toZ: 0, reset: true })] }));
  at(t0 + 1.9, () => { resetAll(); });
  return t0 + 2.2;
}
function seqWind(t0) {
  say(t0, 'Thần Phong Giáng Thế: giơ cung gọi gió → Vệ Thần Gió hiện ra, Lyra bay; cả đội +chính xác');
  at(t0, () => exec(1, 'wind_spirit', { effects: [] }));
  at(t0 + 0.4, () => { lyra.statusEffects = [{ type: 'windspirit', endTime: BIG }]; });
  say(t0 + 2.0, 'Bắn khi bay + Vệ Thần bắn phụ');
  at(t0 + 2.0, () => attack(0));
  at(t0 + 2.32, () => shots([{ by: 'spirit', kind: 'single', effects: [hit(1, 100)] }]));
  at(t0 + 2.9, () => attack(2));
  at(t0 + 3.22, () => shots([{ by: 'spirit', kind: 'single', effects: [hit(2, 100)] }, { by: 'lyra', kind: 'pierce', dir: 1, effects: [hit(0, 140), hit(2, 140)] }, { by: 'spirit', kind: 'pierce', dir: 1, effects: [hit(0, 70), hit(2, 70)] }]));
  return t0 + 4.4;
}
function seqArrows(t0, flying = false) {
  say(t0, flying ? 'Thần Tiễn khi có Vệ Thần: gồng 2s (Vệ Thần cùng kéo cung) → 10 mũi tên ánh sáng' : 'Thần Tiễn Phá Thiên: gồng 2s (gió hút vào) → 6 mũi tên ánh sáng sau lưng → phóng như tên lửa → nổ lớn');
  at(t0, () => { lyra.state = 'casting'; lyra.castingSkillId = 2; T.onCastStart({ casterId: 'me', casterIdx: 0, skillIdx: 2, castTime: 2000 }); });
  const fx = [];
  const n = flying ? 10 : 6;
  for (let k = 0; k < n; k++) fx.push({ ...hit(k % 3, 140), role: k < 6 ? 'lyra' : 'spirit', order: k });
  at(t0 + 2.0, () => { lyra.state = 'idle'; exec(2, 'charged_shot', { effects: fx }); });
  return t0 + 3.6;
}
let end = 0.2;
if (S === 'all') { end = seqAttack(end); end = seqSnipe(end); end = seqArrows(end); end = seqWind(end); end = seqArrows(end, true); at(end, () => { lyra.statusEffects = []; }); end += 1.0; }
else end = ({ attack: seqAttack, snipe: seqSnipe, wind: seqWind, arrows: (t) => seqArrows(t), windarrows: (t) => { const e = seqWind(t); return seqArrows(e, true); } })[S](end);
say(end, '');
window.TOTAL = end + 0.3;
ev.sort((a, b) => a[0] - b[0]);
let t = 0;
window.stepTo = (target) => {
  while (t < target - 1e-9) {
    const dt = Math.min(1 / 60, target - t);
    while (ev.length && ev[0][0] <= t + 1e-9) ev.shift()[1]();
    t += dt; window.__vt = t; window.__runTimers();
    updateVfx(dt);
    [...vA, ...vF].forEach(v => v.update(dt, camera));
  }
  renderer.render(scene, camera);
  return t;
};
window.stepTo(0.02);
if (q.get('auto')) {
  let last = Date.now();
  const loop = () => { const now = Date.now(); window.stepTo(t + Math.min(0.05, (now - last) / 1000)); last = now; if (t > window.TOTAL) location.reload(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
window.__ready = true;
</script></body></html>
