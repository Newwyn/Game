<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#2f4a5a;overflow:hidden}
#lbl{position:fixed;left:10px;top:8px;font:bold 18px sans-serif;color:#ffe680;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:4px}#lbl:empty{display:none}</style></head><body><div id="lbl"></div>
<!-- Xem thử MỌI kỹ năng + hiệu ứng của Rok bản 3 (gọi đúng hàm xử lý sự kiện của game với dữ liệu giả, mốc thời gian như server).
     PHẢI chạy `npm run dev` rồi mở http://localhost:5173/tools/fx-rok.html?s=all&auto=1
     s = all (lần lượt tất cả) | attack | roar | push | guard | link
     &w=1280&h=720 cỡ khung · &auto=1 tự chạy lặp · &rok=cutout bản khung xương · console: stepTo(giây) -->
<script>
  window.__vt = 0; const __timers = []; let __tid = 1;
  window.setTimeout = (fn, ms = 0) => { const id = __tid++; __timers.push({ id, at: window.__vt + (ms || 0) / 1000, fn }); return id; };
  window.clearTimeout = (id) => { const i = __timers.findIndex(t => t.id === id); if (i >= 0) __timers.splice(i, 1); };
  window.__runTimers = () => { for (;;) { __timers.sort((a, b) => a.at - b.at); if (!__timers.length || __timers[0].at > window.__vt) break; __timers.shift().fn(); } };
  performance.now = () => 1 + window.__vt * 1000;
</script>
<script type="module">
import * as THREE from 'three';
import { scene, camera, renderer } from '../src/core/scene.js';
import { updateVfx } from '../src/vfx/vfx.js';
import { timeState } from '../src/config.js';
import { game } from '../src/state.js';
import { createCharacterView } from '../src/characters/registry.js';
import { makeRokTether } from '../src/vfx/linkFx.js';
import { __fxTest as T } from '../src/combat/events.js';
timeState.clock = 0; timeState.recvAt = 1; timeState.scale = 1;
const q = new URLSearchParams(location.search);
const S = q.get('s') || 'all';
const W = +(q.get('w') || 1280), H = +(q.get('h') || 720);
document.body.appendChild(renderer.domElement);
renderer.setSize(W, H); camera.aspect = W / H; camera.fov = 34; camera.updateProjectionMatrix();
const CX = +(q.get('cx') ?? 0.8), CY = +(q.get('cy') ?? 1.7), CZ = +(q.get('cz') ?? 15);
camera.position.set(CX, CY + 2.7, CZ); camera.lookAt(CX, CY, 0);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshLambertMaterial({ color: 0x6d8f55 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.5; scene.add(ground);
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const mk = (classId, x, side, z = 0) => ({ classId, alive: true, statusEffects: [], x, z, hp: 100, maxHp: 100, mp: 3000, maxMp: 5000, state: 'idle', side,
  skillCooldowns: [0, 0, 0], queuedSkills: [], targetIndex: 0 });
const rok = mk('warrior', -2.2, 'left');
const ally = mk('mage', -6.5, 'left', -1.2);
const allies = [rok, ally];
const foes = [mk('monster_tank', 1.6, 'right'), mk('monster_archer', 4.6, 'right', -1), mk('monster_supporter', 3.6, 'right', 1.2)];
game.roomData = { players: { me: { squad: allies }, op: { squad: foes } } };
game.classDefs = { warrior: { skills: [{ type: 'taunt', hitFrame: 2 }, { type: 'knockback', hitFrame: 2 }, { type: 'guard', hitFrame: 2 }] },
  mage: { skills: [] }, monster_tank: { skills: [] }, monster_archer: { skills: [] }, monster_supporter: { skills: [] } };
const vA = allies.map(m => createCharacterView(m, game.classDefs[m.classId], true));
const vF = foes.map(f => createCharacterView(f, { skills: [] }, false));
vF.forEach(v => { v.facingLeft = true; });
game.views = { me: vA, op: vF };
[...vA, ...vF].forEach(v => scene.add(v.root));
window.view = vA[0];

const lbl = document.getElementById('lbl');
const ev = [];
const at = (t, fn) => ev.push([t, fn]);
const say = (t, s) => at(t, () => { lbl.textContent = s; });
const BIG = 1e12;
const hits = (idx, dmg = 120, extra = {}) => idx.map(i => ({ targetIndex: i, damage: dmg, isCrit: false, isBlock: false, isMiss: false, ...extra }));
const exec = (skillIdx, type, payload = {}) => T.onSkillExecuted({ casterId: 'me', casterIdx: 0, skillIdx, type, effects: [], ...payload });
const attack = (ti = 0) => T.onAutoAttack({ attackerId: 'me', attackerIndex: 0, targetId: 'op', targetIndex: ti, damage: 152, isCrit: false });
const resetFoes = () => foes.forEach((f, i) => { vF[i].teleport(f.x, f.z ?? 0, true); f.statusEffects = []; });

function seqAttack(t0) { say(t0, 'Đánh thường: bổ kiếm'); at(t0, () => attack(0)); at(t0 + 1.1, () => attack(0)); return t0 + 2.2; }
function seqRoar(t0) {
  say(t0, 'Sư Tử Gầm: linh hồn sư tử + sóng gầm + dấu khiêu khích');
  at(t0, () => exec(0, 'taunt', { effects: hits([0, 1, 2], 120, { taunted: true }).map((e, i) => ({ ...e, dist: [3.8, 6.8, 5.8][i] })) }));
  return t0 + 2.2;
}
function seqPush(t0) {
  say(t0, 'Đẩy Khiên: húc khiên → quái bay → địa chấn');
  const f = foes[0], toX = f.x + 5;
  at(t0, () => exec(1, 'knockback', { newX: rok.x, newZ: 0, effects: [{ targetIndex: 0, damage: 182, isCrit: false, isMiss: false, knockback: true, toX, toZ: 0 }] }));
  at(t0 + 0.22 + 0.45, () => T.onRokFx({ kind: 'quake', casterId: 'me', casterIdx: 0, x: toX, z: 0, radius: 3 }));
  at(t0 + 2.0, () => { f.x = 1.6; resetFoes(); });
  return t0 + 2.3;
}
function seqGuard(t0) {
  say(t0, 'Dựng Khiên: cắm khiên → Khiên Thần + cả đội +thủ');
  const g = { type: 'guard', endTime: BIG, hp: 1200, maxHp: 1200 };
  at(t0, () => {
    exec(2, 'guard', { effects: [{ targetIndex: 0, ally: true }, { targetIndex: 1, ally: true, aura: true }] });
    rok.statusEffects = [g]; rok.state = 'guarding';
  });
  at(t0 + 0.32, () => vA[0].setLocomotion('guarding'));
  const burst = (k, final = false) => T.onGuardBurst({ casterId: 'me', casterIdx: 0, final, effects: hits([0, 2], 96),
    heals: [{ targetIndex: 0, heal: 80 }, { targetIndex: 1, heal: 45 }] });
  for (let k = 1; k <= 3; k++) {
    say(t0 + 0.8 + k * 0.9, `Khiên nổ sóng lần ${k} (máu khiên ${6 - 2 * k}/6)`);
    at(t0 + 0.8 + k * 0.9, () => { g.hp = 1200 * (1 - k / 3 * 0.84); burst(k); });
  }
  const tEnd = t0 + 0.8 + 4 * 0.9;
  say(tEnd, 'Hết khiên: nổ cuối → Khiên Thần vỡ tan');
  at(tEnd, () => { burst(4, true); rok.statusEffects = []; rok.state = 'idle'; vA[0].setLocomotion('ready'); });
  return tEnd + 1.4;
}
let tether = null;
function seqLink(t0) {
  say(t0, 'Ý Chí Thép: xích ánh sáng nối Rok với đồng đội');
  at(t0, () => { tether = makeRokTether(); scene.add(tether.group); tether.on = true; });
  at(t0 + 1.2, () => T.onRokFx({ kind: 'share', casterId: 'me', casterIdx: 0, linkIdx: 1, damage: 40, absorbed: 0 }));
  at(t0 + 2.0, () => T.onRokFx({ kind: 'ironHeal', casterId: 'me', casterIdx: 0, heal: 90 }));
  at(t0 + 2.8, () => { tether.on = false; });
  return t0 + 3.4;
}
let end = 0.2;
if (S === 'all') { end = seqAttack(end); end = seqRoar(end); end = seqPush(end); end = seqGuard(end); end = seqLink(end); }
else end = ({ attack: seqAttack, roar: seqRoar, push: seqPush, guard: seqGuard, link: seqLink })[S](end);
say(end, '');
window.TOTAL = end + 0.3;
ev.sort((a, b) => a[0] - b[0]);
let t = 0;
window.stepTo = (target) => {
  while (t < target - 1e-9) {
    const dt = Math.min(1 / 60, target - t);
    while (ev.length && ev[0][0] <= t + 1e-9) ev.shift()[1]();
    t += dt; window.__vt = t; window.__runTimers();
    updateVfx(dt);
    [...vA, ...vF].forEach(v => v.update(dt, camera));
    if (tether) {
      const k = tether.update(dt, vA[0].position, vA[1].position, 0.9, 0.9, tether.on);
      if (!tether.on && k < 0.03) { tether.dispose(); tether = null; }
    }
  }
  renderer.render(scene, camera);
  return t;
};
window.stepTo(0.02);
if (q.get('auto')) {
  let last = Date.now();
  const loop = () => { const now = Date.now(); window.stepTo(t + Math.min(0.05, (now - last) / 1000)); last = now; if (t > window.TOTAL) location.reload(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
window.__ready = true;
</script></body></html>
